{{ define "head" }}
  <script src="https://kit.fontawesome.com/924a0097e6.js" crossorigin="anonymous"></script>
{{ end }}
{{ define "main" }}
  {{ if .Params.alert }}
  <div class="alert alert-warning text-center">
    {{ .Params.alert|safeHTML }}
  </div>
  {{ end }}
  <h1>{{ .Params.title }}</h1>
  {{ .Content }}
  <ul>
    {{ range .Pages.ByTitle.Reverse }}
    <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
{{ end }}
